<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto — Teju Shoes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="index.html">Teju <span>Shoes</span></a>
      <nav class="topbar-nav">
        <a href="index.html#catalogo">Catálogo</a>
        <a href="index.html#contacto-footer">Contacto</a>
      </nav>
      <button class="cart-btn" id="cart-open-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        Carrito
        <span class="cart-count" id="cart-count" style="display:none;">0</span>
      </button>
    </div>
  </div>

  <div class="wrap" style="padding-top:20px;">
    <a class="back-btn" href="index.html">← Volver al catálogo</a>
  </div>

  <div class="wrap producto-grid" id="producto-wrap" style="display:none;">
    <div class="producto-photo" id="producto-photo"></div>
    <div>
      <div class="eyebrow producto-cat" id="producto-cat"></div>
      <h1 class="producto-nombre" id="producto-nombre"></h1>
      <div class="producto-precio" id="producto-precio"></div>
      <p class="producto-desc" id="producto-desc"></p>

      <div class="talla-picker-label">Elegí tu talle</div>
      <div class="talla-grid" id="talla-grid"></div>

      <div class="cantidad-row">
        <div class="qty-control">
          <button type="button" id="qty-menos">−</button>
          <span id="qty-value">1</span>
          <button type="button" id="qty-mas">+</button>
        </div>
      </div>

      <div class="form-error" id="add-error"></div>
      <button class="btn btn-cork btn-block" id="add-cart-btn">Agregar al carrito</button>
    </div>
  </div>

  <div class="wrap" id="producto-loading">
    <div class="loading-row">Cargando producto…</div>
  </div>

  <!-- CARRITO -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-head">
      <h3>Tu carrito</h3>
      <button class="cart-close" id="cart-close" type="button">×</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-foot">
      <div class="cart-total-row">
        <span>Total</span>
        <span id="cart-total">$0</span>
      </div>
      <a class="btn btn-primary btn-block" href="carrito.html">Ir a pagar</a>
    </div>
  </aside>

  <footer class="site-footer">
    <div class="wrap">
      <div class="stitch" style="margin-bottom:26px;"></div>
      <div class="site-footer-inner">
        <span class="site-footer-title">Teju Shoes © <span id="footer-year"></span></span>
        <div class="site-footer-links">
          <a class="footer-link" id="footer-wsp-link" target="_blank" rel="noopener">WhatsApp</a>
          <a class="footer-link" id="footer-ig-link" target="_blank" rel="noopener">Instagram</a>
        </div>
      </div>
    </div>
  </footer>

  <script type="module">
    import { firebaseConfig, WHATSAPP_PEDIDOS, INSTAGRAM_TEJU } from './firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { initializeFirestore, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { formatearPrecioARS, agregarAlCarrito, initCartDrawerToggle, renderCartDrawer } from './carrito.js';

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

    document.getElementById('footer-year').textContent = new Date().getFullYear();
    const wspTexto = encodeURIComponent('Hola! Tengo una consulta sobre Teju Shoes.');
    document.getElementById('footer-wsp-link').href = `https://wa.me/${WHATSAPP_PEDIDOS}?text=${wspTexto}`;
    document.getElementById('footer-ig-link').href = INSTAGRAM_TEJU;

    function escapeHtml(str){
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Compatibilidad: productos viejos guardaban tallas como array de strings con un precio único.
    function normalizarTallas(p){
      const tallas = p.tallas || [];
      if(!tallas.length) return [];
      if(typeof tallas[0] === 'object' && tallas[0] !== null) return tallas;
      return tallas.map(t => ({ talla: t, precio: p.precio ?? 0 }));
    }

    const params = new URLSearchParams(window.location.search);
    const productoId = params.get('id');
    let producto = null;
    let tallasDisponibles = [];
    let tallaElegida = null;
    let precioElegido = null;
    let cantidad = 1;

    async function cargarProducto(){
      const loadingEl = document.getElementById('producto-loading');
      if(!productoId){
        loadingEl.innerHTML = '<div class="empty-state">No se indicó qué producto mostrar.</div>';
        return;
      }
      try{
        const snap = await getDoc(doc(db, "productos", productoId));
        if(!snap.exists()){
          loadingEl.innerHTML = '<div class="empty-state">Este producto ya no está disponible.</div>';
          return;
        }
        producto = { id: snap.id, ...snap.data() };
        renderProducto();
      }catch(err){
        console.error('Error al cargar el producto:', err);
        loadingEl.innerHTML = '<div class="empty-state">No se pudo cargar el producto. Probá de nuevo.</div>';
      }
    }

    function renderProducto(){
      document.title = `${producto.nombre} — Teju Shoes`;
      document.getElementById('producto-loading').style.display = 'none';
      document.getElementById('producto-wrap').style.display = 'grid';

      const photoEl = document.getElementById('producto-photo');
      if(producto.imagen){
        photoEl.style.backgroundImage = `url('${producto.imagen}')`;
      }

      document.getElementById('producto-cat').textContent = producto.categoria || 'Calzado';
      document.getElementById('producto-nombre').textContent = producto.nombre;
      document.getElementById('producto-desc').textContent = producto.descripcion || '';

      tallasDisponibles = normalizarTallas(producto);
      actualizarPrecioMostrado();

      const tallaGrid = document.getElementById('talla-grid');
      if(!tallasDisponibles.length){
        tallaGrid.innerHTML = '<span class="form-note">Talle único.</span>';
        precioElegido = producto.precio;
        actualizarPrecioMostrado();
      }else{
        tallaGrid.innerHTML = tallasDisponibles.map(t => `<button type="button" class="talla-opcion" data-talla="${escapeHtml(t.talla)}" data-precio="${t.precio}">${escapeHtml(t.talla)}</button>`).join('');
        tallaGrid.querySelectorAll('.talla-opcion').forEach(btn => {
          btn.addEventListener('click', () => {
            tallaElegida = btn.dataset.talla;
            precioElegido = Number(btn.dataset.precio);
            tallaGrid.querySelectorAll('.talla-opcion').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('add-error').textContent = '';
            actualizarPrecioMostrado();
          });
        });
      }
    }

    // Muestra el precio del talle elegido, o un rango ("Desde $X") si todavía no se eligió ninguno.
    function actualizarPrecioMostrado(){
      const el = document.getElementById('producto-precio');
      if(precioElegido != null){
        el.textContent = formatearPrecioARS(precioElegido);
        return;
      }
      if(!tallasDisponibles.length){
        el.textContent = formatearPrecioARS(producto.precio);
        return;
      }
      const precios = tallasDisponibles.map(t => t.precio);
      const min = Math.min(...precios), max = Math.max(...precios);
      el.textContent = max > min ? `Desde ${formatearPrecioARS(min)}` : formatearPrecioARS(min);
    }

    document.getElementById('qty-mas').addEventListener('click', () => {
      cantidad++;
      document.getElementById('qty-value').textContent = cantidad;
    });
    document.getElementById('qty-menos').addEventListener('click', () => {
      if(cantidad > 1) cantidad--;
      document.getElementById('qty-value').textContent = cantidad;
    });

    document.getElementById('add-cart-btn').addEventListener('click', () => {
      const errorEl = document.getElementById('add-error');
      errorEl.textContent = '';

      if(tallasDisponibles.length && !tallaElegida){
        errorEl.textContent = 'Elegí un talle antes de agregar al carrito.';
        return;
      }

      agregarAlCarrito({
        productoId: producto.id,
        nombre: producto.nombre,
        talla: tallaElegida || 'Único',
        precio: precioElegido != null ? precioElegido : producto.precio,
        imagen: producto.imagen || '',
        cantidad
      });

      const drawer = document.getElementById('cart-drawer');
      const overlay = document.getElementById('cart-overlay');
      drawer.classList.add('open');
      overlay.classList.add('open');
      renderCartDrawer();
    });

    cargarProducto();
    initCartDrawerToggle();
  </script>
</body>
</html>
